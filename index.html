<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Logístico - Bemol</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Ecrã de Login -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Portal Logístico</h2>
            <form id="login-form" onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Utilizador</label>
                    <input type="text" id="username" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="senha" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Entrar</button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden mt-2">Utilizador ou senha incorretos</p>
            </form>
        </div>
    </div>

    <!-- Painel Principal -->
    <div id="app-screen" class="hidden flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Gestão de Operações e Agendamentos</h1>
                <p class="text-xs text-slate-500">Perfil ativo: <span id="user-profile-badge" class="font-semibold uppercase text-blue-600"></span></p>
            </div>
            <button onclick="terminarSessao()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium transition">Sair</button>
        </header>

        <main class="max-w-7xl w-full mx-auto p-6 flex-1 space-y-6">
            <!-- Formulário de Nova Operação -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Registar Nova Operação / Agendamento</h2>
                <form id="operacao-form" onsubmit="guardarOperacao(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Seller / Lojista</label>
                        <input type="text" id="seller" required placeholder="Nome do Seller" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Transportadora</label>
                        <input type="text" id="transportadora" required placeholder="Ex: LATAM / KM Cargo" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <!-- Campo Motorista (Ocultado se perfil for CD) -->
                    <div id="campo-motorista" class="hidden-field">
                        <label class="block text-xs font-medium text-slate-600 mb-1">Motorista</label>
                        <input type="text" id="motorista" placeholder="Nome do motorista" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <!-- Campo Placa (Ocultado se perfil for CD) -->
                    <div id="campo-placa" class="hidden-field">
                        <label class="block text-xs font-medium text-slate-600 mb-1">Placa do Veículo</label>
                        <input type="text" id="veiculo_placa" placeholder="Ex: PHX-8A32" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Nota Fiscal (NF)</label>
                        <input type="text" id="nota_fiscal" required placeholder="Número da NF" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Tipo de Carga</label>
                        <select id="tipo_carga" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                            <option value="Alto Valor">Alto Valor</option>
                            <option value="Marketplace">Marketplace</option>
                            <option value="Geral">Geral</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Data Prevista</label>
                        <input type="datetime-local" id="data_agendamento" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Etapa Atual da Operação</label>
                        <select id="status_etapa" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
                            <option value="Emissão do Pedido">1. Emissão do Pedido</option>
                            <option value="Coleta Agendada">2. Coleta Agendada</option>
                            <option value="Coleta Realizada">3. Coleta Realizada</option>
                            <option value="Em Trânsito SP-MAO">4. Em Trânsito SP-MAO</option>
                            <option value="Recebido no CD">5. Recebido no CD</option>
                        </select>
                    </div>
                    <div class="md:col-span-3 flex justify-end mt-2">
                        <button type="submit" class="bg-orange-600 hover:bg-orange-700 text-white font-semibold px-6 py-2 rounded-lg text-sm transition">Guardar Registo de Operação</button>
                    </div>
                </form>
            </div>

            <!-- Listagem -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Acompanhamento de Pedidos e Coletas por Seller</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                            <tr>
                                <th class="p-3">ID</th>
                                <th class="p-3">Seller</th>
                                <th class="p-3">Transportadora</th>
                                <th class="p-3">Motorista / Placa</th>
                                <th class="p-3">NF</th>
                                <th class="p-3">Carga</th>
                                <th class="p-3">Data</th>
                                <th class="p-3">Etapa Atual</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-agendamentos" class="divide-y divide-slate-200">
                            <tr><td colspan="8" class="p-4 text-center text-slate-400">A carregar registos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUser = null;

        async function fazerLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, senha })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = data;
                    localStorage.setItem('user', JSON.stringify(data));
                    aplicarPermissoesPerfil();
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    carregarAgendamentos();
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } catch (err) {
                alert('Erro ao ligar ao servidor');
            }
        }

        function aplicarPermissoesPerfil() {
            document.getElementById('user-profile-badge').innerText = `${currentUser.username} (${currentUser.perfil})`;
            
            // Se for o perfil 'cd', ocultar os campos de Motorista e Placa do Veículo
            const campoMotorista = document.getElementById('campo-motorista');
            const campoPlaca = document.getElementById('campo-placa');
            const inputMotorista = document.getElementById('motorista');
            const inputPlaca = document.getElementById('veiculo_placa');

            if (currentUser.perfil === 'cd') {
                campoMotorista.classList.add('hidden');
                campoPlaca.classList.add('hidden');
                inputMotorista.removeAttribute('required');
                inputPlaca.removeAttribute('required');
                inputMotorista.value = 'N/A (CD)';
                inputPlaca.value = 'N/A (CD)';
            } else {
                campoMotorista.classList.remove('hidden');
                campoPlaca.classList.remove('hidden');
                inputMotorista.value = '';
                inputPlaca.value = '';
            }
        }

        function terminarSessao() {
            localStorage.removeItem('user');
            location.reload();
        }

        async function guardarOperacao(e) {
            e.preventDefault();
            const dados = {
                seller: document.getElementById('seller').value,
                transportadora: document.getElementById('transportadora').value,
                motorista: document.getElementById('motorista').value || 'N/A',
                veiculo_placa: document.getElementById('veiculo_placa').value || 'N/A',
                nota_fiscal: document.getElementById('nota_fiscal').value,
                tipo_carga: document.getElementById('tipo_carga').value,
                data_agendamento: document.getElementById('data_agendamento').value,
                status_etapa: document.getElementById('status_etapa').value
            };

            const res = await fetch('/api/agendamentos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                document.getElementById('operacao-form').reset();
                aplicarPermissoesPerfil(); // Reaplicar defaults se CD
                carregarAgendamentos();
            } else {
                alert('Erro ao guardar operação');
            }
        }

        async function carregarAgendamentos() {
            const res = await fetch('/api/agendamentos');
            const lista = await res.json();
            const tbody = document.getElementById('tabela-agendamentos');
            
            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">Nenhum registo encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = lista.map(item => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-medium text-slate-900">${item.id}</td>
                    <td class="p-3">${item.seller}</td>
                    <td class="p-3">${item.transportadora}</td>
                    <td class="p-3">${item.motorista} / ${item.veiculo_placa}</td>
                    <td class="p-3 font-semibold text-blue-600">${item.nota_fiscal}</td>
                    <td class="p-3"><span class="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded font-medium">${item.tipo_carga}</span></td>
                    <td class="p-3">${new Date(item.data_agendamento).toLocaleString('pt-BR')}</td>
                    <td class="p-3"><span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded font-medium">${item.status_etapa}</span></td>
                </tr>
            `).join('');
        }

        // Verificar sessão guardada
        window.onload = () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                aplicarPermissoesPerfil();
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                carregarAgendamentos();
            }
        };
    </script>
</body>
</html>
